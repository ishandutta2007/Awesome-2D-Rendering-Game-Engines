<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#12182b" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e0e7ff;
      }
      .grid-line {
        stroke: #334155;
        stroke-opacity: 0.25;
        stroke-width: 1;
      }
      
      /* Dynamic animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(3deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-4deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes spriteDrift {
        0% { transform: translateX(0px); }
        50% { transform: translateX(25px); }
        100% { transform: translateX(0px); }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
      }

      .floating-orb1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .floating-orb2 {
        animation: pulseGlow 9s ease-in-out infinite 1.5s;
        transform-origin: 1050px 240px;
      }
      .anim-card1 {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-card2 {
        animation: floatFast 7.5s ease-in-out infinite 0.5s;
        transform-origin: center;
      }
      .anim-sprite {
        animation: spriteDrift 5s ease-in-out infinite;
      }
      .anim-orbit {
        animation: orbit 10s linear infinite;
        transform-origin: 1040px 120px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Isometric 2D Grid Pattern (Visualizing 2D Tilemaps) -->
  <g opacity="0.45">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" class="grid-line" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" class="grid-line" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" class="floating-orb1" />
  <circle cx="1020" cy="220" r="160" fill="#a855f7" filter="url(#glow)" class="floating-orb2" />
  <circle cx="600" cy="330" r="100" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Geometric Isometric 2D Tiles (Representing 2D Game Engines / Pixels) -->
  <g class="anim-card1" opacity="0.6">
    <polygon points="1050,60 1100,85 1050,110 1000,85" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="1050,110 1100,85 1100,125 1050,150" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="1050,110 1000,85 1000,125 1050,150" fill="#0369a1" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <g class="anim-card2" opacity="0.5">
    <polygon points="120,230 160,250 120,270 80,250" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="120,270 160,250 160,285 120,305" fill="#9333ea" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="120,270 80,250 80,285 120,305" fill="#7e22ce" fill-opacity="0.4" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Orbiting Particle -->
  <circle cx="1040" cy="120" r="5" fill="#38bdf8" class="anim-orbit" filter="url(#glow)" />

  <!-- Animated Floating Feature Badges (Pills) -->
  <g class="anim-sprite" opacity="0.9">
    <!-- WebGL / WebGPU Tag -->
    <rect x="70" y="45" width="130" height="30" rx="15" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" />
    <text x="135" y="65" text-anchor="middle" class="badge-text">⚡ WebGL &amp; WebGPU</text>

    <!-- Cross-Platform Tag -->
    <rect x="990" y="295" width="140" height="30" rx="15" fill="url(#pillGrad2)" stroke="#ec4899" stroke-width="1" />
    <text x="1060" y="315" text-anchor="middle" class="badge-text">🎮 Cross-Platform</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitles (High Contrast, Never Obscured) -->
  <g transform="translate(600, 140)">
    <!-- Main Header -->
    <text x="0" y="0" text-anchor="middle" class="title-text">Awesome 2D Rendering &amp; Game Engines</text>
    
    <!-- Subtitle Line 1 -->
    <text x="0" y="48" text-anchor="middle" class="subtitle-text">Curated Directory of Commercial Platforms, Frameworks &amp; Open-Source Engines</text>

    <!-- Subtitle Line 2 / Feature Badges in Center Foreground -->
    <g transform="translate(0, 95)">
      <!-- Pill 1: Sprites & Tilemaps -->
      <g transform="translate(-240, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">👾 Sprites &amp; Tilemaps</text>
      </g>
      <!-- Pill 2: 2D Physics -->
      <g transform="translate(-70, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">⚙️ 2D Physics</text>
      </g>
      <!-- Pill 3: HTML5 & Native -->
      <g transform="translate(90, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f472b6">🌐 HTML5 &amp; Native</text>
      </g>
      <!-- Pill 4: Open Source & SaaS -->
      <g transform="translate(265, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#34d399">🚀 Open-Source &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>
