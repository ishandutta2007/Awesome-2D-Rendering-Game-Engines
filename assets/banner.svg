<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#12182b"/><stop offset="100%" stop-color="#0d1117"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".3"/></linearGradient><linearGradient id="pillGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".25"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".08"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".01"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(3deg)}}@keyframes floatFast{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(-4deg)}}@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes spriteDrift{0%{transform:translateX(0)}50%{transform:translateX(25px)}}@keyframes orbit{0%{transform:rotate(0deg) translateX(45px) rotate(0deg)}}.title-text{font-weight:800;font-size:46px;fill:url(#primaryGrad);letter-spacing:-.5px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8;letter-spacing:.3px}.badge-text{font-weight:600;font-size:13px;fill:#e0e7ff}.grid-line{stroke:#334155;stroke-opacity:.25;stroke-width:1}.floating-orb1{animation:pulseGlow 7s ease-in-out infinite;transform-origin:200px 100px}.floating-orb2{animation:pulseGlow 9s ease-in-out infinite 1.5s;transform-origin:1050px 240px}.anim-card1,.anim-card2{animation:floatSlow 6s ease-in-out infinite;transform-origin:center}.anim-card2{animation:floatFast 7.5s ease-in-out infinite .5s}.anim-sprite{animation:spriteDrift 5s ease-in-out infinite}.anim-orbit{animation:orbit 10s linear infinite;transform-origin:1040px 120px}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g opacity=".45"><path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" class="grid-line"/><path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" class="grid-line"/></g><circle cx="200" cy="90" r="140" fill="#38bdf8" class="floating-orb1" filter="url(#glow)"/><circle cx="1020" cy="220" r="160" fill="#a855f7" class="floating-orb2" filter="url(#glow)"/><circle cx="600" cy="330" r="100" fill="#ec4899" filter="url(#glow)" opacity=".2"/><g class="anim-card1" opacity=".6"><polygon fill="#38bdf8" fill-opacity=".25" stroke="#38bdf8" stroke-width="1.5" points="1050 60 1100 85 1050 110 1000 85"/><polygon fill="#0284c7" fill-opacity=".35" stroke="#38bdf8" stroke-width="1.5" points="1050 110 1100 85 1100 125 1050 150"/><polygon fill="#0369a1" fill-opacity=".45" stroke="#38bdf8" stroke-width="1.5" points="1050 110 1000 85 1000 125 1050 150"/></g><g class="anim-card2" opacity=".5"><polygon fill="#c084fc" fill-opacity=".2" stroke="#c084fc" stroke-width="1.5" points="120 230 160 250 120 270 80 250"/><polygon fill="#9333ea" fill-opacity=".3" stroke="#c084fc" stroke-width="1.5" points="120 270 160 250 160 285 120 305"/><polygon fill="#7e22ce" fill-opacity=".4" stroke="#c084fc" stroke-width="1.5" points="120 270 80 250 80 285 120 305"/></g><circle cx="1040" cy="120" r="5" fill="#38bdf8" class="anim-orbit" filter="url(#glow)"/><g class="anim-sprite" opacity=".9"><rect width="130" height="30" x="70" y="45" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" rx="15"/><text x="135" y="65" class="badge-text" text-anchor="middle">⚡ WebGL &amp; WebGPU</text><rect width="140" height="30" x="990" y="295" fill="url(#pillGrad2)" stroke="#ec4899" stroke-width="1" rx="15"/><text x="1060" y="315" class="badge-text" text-anchor="middle">🎮 Cross-Platform</text></g><g><text x="0" y="0" class="title-text" text-anchor="middle" transform="translate(600, 140)">Awesome 2D Rendering &amp; Game Engines</text><text x="0" y="48" class="subtitle-text" text-anchor="middle" transform="translate(600, 140)">Curated Directory of Commercial Platforms, Frameworks &amp; Open-Source Engines</text><g><g transform="translate(600, 140) translate(0, 95) translate(-240, 0)"><rect width="170" height="32" x="-85" y="-16" fill="#1e293b" stroke="#475569" stroke-width="1.2" rx="16"/><text x="0" y="5" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">👾 Sprites &amp; Tilemaps</text></g><g transform="translate(600, 140) translate(0, 95) translate(-70, 0)"><rect width="130" height="32" x="-65" y="-16" fill="#1e293b" stroke="#475569" stroke-width="1.2" rx="16"/><text x="0" y="5" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚙️ 2D Physics</text></g><g transform="translate(600, 140) translate(0, 95) translate(90, 0)"><rect width="150" height="32" x="-75" y="-16" fill="#1e293b" stroke="#475569" stroke-width="1.2" rx="16"/><text x="0" y="5" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 HTML5 &amp; Native</text></g><g transfor